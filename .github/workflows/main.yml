name: Run YouTube Clipper Bot

on:
  workflow_dispatch:          # manual start: Actions tab -> Run workflow
  schedule:
    - cron: "0 */6 * * *"     # har 6 ghante restart (GitHub job limit 6h hai)

# Ek time par sirf ek bot chale (do instance = Telegram "Conflict" error).
# Naya run purane ke khatam hone tak wait karega.
concurrency:
  group: videoclip-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4     # yt-dlp ko YouTube JS challenge ke liye node chahiye
        with:
          node-version: "22"

      - name: System packages (ffmpeg + fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg fontconfig fonts-noto-core fonts-noto-extra fonts-noto-color-emoji
          sudo fc-cache -f
          fc-list :lang=hi | grep -qi devanagari   # Hindi subtitle font check

      - name: Python packages
        run: pip install -r requirements.txt

      - name: yt-dlp config
        run: echo "--js-runtimes node" | sudo tee /etc/yt-dlp.conf

      - name: Cookies (optional)
        env:
          COOKIES_TXT: ${{ secrets.COOKIES_TXT }}
        run: |
          if [ -n "$COOKIES_TXT" ]; then
            printf '%s\n' "$COOKIES_TXT" > "$RUNNER_TEMP/cookies.txt"
            echo "COOKIES_FILE=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"
          fi

      - name: Start bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          FORCE_JOIN_CHANNEL: ${{ secrets.FORCE_JOIN_CHANNEL }}
          MAX_JOBS: "1"
          MAX_TEMP_MB: "4096"
        run: |
          # 5h 50m baad bot ko SIGTERM do (graceful stop), phir naya run uthayega
          timeout -s TERM 350m python bot.py || [ $? -eq 124 ]
